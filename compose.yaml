name: telaviva

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-telaviva}
      POSTGRES_USER: ${POSTGRES_USER:-telaviva}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-telaviva_local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    image: postgres:16-alpine
    environment:
      PGURL: ${MIGRATION_DATABASE_URL:-postgresql://telaviva:telaviva_local@postgres:5432/telaviva}
    volumes:
      - ./apps/api/migrations:/migrations:ro
    command:
      - sh
      - -c
      - set -e; for migration in /migrations/*.sql; do psql "$$PGURL" -v ON_ERROR_STOP=1 -f "$$migration"; done
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./apps/api
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://telaviva:telaviva_local@postgres:5432/telaviva}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      API_CORS_ORIGINS: '${API_CORS_ORIGINS:-["http://localhost:5173"]}'
      JWT_SECRET: ${JWT_SECRET:-development-only-change-me-at-least-32-characters}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
