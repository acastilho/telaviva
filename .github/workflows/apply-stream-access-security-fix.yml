name: Apply stream access security fix

on:
  push:
    branches:
      - fix/issue-8-active-live-system-v2
    paths:
      - .github/workflows/apply-stream-access-security-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-8-active-live-system-v2
          fetch-depth: 0

      - name: Apply authorization fix and regression tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, *, count: int = 1) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected snippet not found in {path}: {old[:100]!r}')
              file.write_text(text.replace(old, new, count), encoding='utf-8')

          # Public scheduling responses must never serialize the P2P room identifier.
          replace(
              'apps/api/app/scheduling/schemas.py',
              '    live_room_id: str | None = None\n',
              '',
          )

          # The authenticated commerce access decision is the only viewer-facing path
          # allowed to release an active room identifier.
          replace(
              'apps/api/app/commerce/models.py',
              '    checked_at: datetime\n',
              '    checked_at: datetime\n    live_room_id: str | None = None\n',
          )
          replace(
              'apps/api/app/commerce/schemas.py',
              'class AccessResponse(BaseModel):\n    stream_id: UUID\n    granted: bool\n    reason: str\n    entitlement_id: UUID | None\n    checked_at: datetime\n',
              'class AccessResponse(BaseModel):\n    stream_id: UUID\n    granted: bool\n    reason: str\n    entitlement_id: UUID | None\n    checked_at: datetime\n    live_room_id: str | None = None\n',
          )
          replace(
              'apps/api/app/commerce/repository.py',
              '                "SELECT s.creator_id,s.access_type,"\n',
              '                "SELECT s.creator_id,s.access_type,s.live_started_at,s.live_ended_at,s.live_room_id,"\n',
          )
          replace(
              'apps/api/app/commerce/repository.py',
              '''            decision = AccessDecision(\n                stream_id, user_id, granted, reason, entitlement_id, datetime.now(UTC)\n            )\n''',
              '''            live_room_id = (\n                row["live_room_id"]\n                if granted\n                and row["live_started_at"] is not None\n                and row["live_ended_at"] is None\n                else None\n            )\n            decision = AccessDecision(\n                stream_id=stream_id,\n                user_id=user_id,\n                granted=granted,\n                reason=reason,\n                entitlement_id=entitlement_id,\n                checked_at=datetime.now(UTC),\n                live_room_id=live_room_id,\n            )\n''',
          )

          # Browser contract: public stream metadata has no room id. Access returns it
          # only after the existing authenticated entitlement/invitation check.
          replace(
              'apps/web/src/scheduling.ts',
              '  live_room_id?: string | null\n',
              '',
          )
          replace(
              'apps/web/src/scheduling.ts',
              '''export type StreamCreatePayload = {\n  title: string\n  description?: string\n  objective: string\n  starts_at: string\n  estimated_duration_minutes: number\n  category_id: string\n  level: ScheduledStream['level']\n  price: string\n  access_type: ScheduledStream['access_type']\n}\n\n''',
              '''export type StreamCreatePayload = {\n  title: string\n  description?: string\n  objective: string\n  starts_at: string\n  estimated_duration_minutes: number\n  category_id: string\n  level: ScheduledStream['level']\n  price: string\n  access_type: ScheduledStream['access_type']\n}\n\nexport type StreamAccessResponse = {\n  stream_id: string\n  granted: boolean\n  reason: string\n  entitlement_id: string | null\n  checked_at: string\n  live_room_id: string | null\n}\n\n''',
          )
          replace(
              'apps/web/src/scheduling.ts',
              '''  finish(streamId: string, accessToken: string): Promise<ScheduledStream> {\n    return request<ScheduledStream>(`/streams/${encodeURIComponent(streamId)}/finish`, { method: 'POST' }, accessToken)\n  },\n\n  async activeByRoom(roomId: string): Promise<ScheduledStream | null> {\n    const active = await request<ScheduledStream[]>('/streams/active')\n    return active.find((stream) => stream.live_room_id === roomId) ?? null\n  },\n''',
              '''  finish(streamId: string, accessToken: string): Promise<ScheduledStream> {\n    return request<ScheduledStream>(`/streams/${encodeURIComponent(streamId)}/finish`, { method: 'POST' }, accessToken)\n  },\n\n  access(streamId: string, accessToken: string): Promise<StreamAccessResponse> {\n    return request<StreamAccessResponse>(`/streams/${encodeURIComponent(streamId)}/access`, { method: 'POST' }, accessToken)\n  },\n''',
          )

          # Public links carry the non-secret stream id, never the P2P room id.
          replace(
              'apps/web/src/peerBroadcast.ts',
              '''export function createViewerUrl(roomId: string) {\n  const url = new URL(window.location.href)\n  url.search = ''\n  url.hash = ''\n  url.searchParams.set('live', normalizeRoomId(roomId))\n  return url.toString()\n}\n''',
              '''export function createViewerUrl(streamId: string) {\n  const url = new URL(window.location.href)\n  url.search = ''\n  url.hash = ''\n  url.searchParams.set('live', streamId)\n  return url.toString()\n}\n''',
          )
          replace(
              'apps/web/src/LiveStudio.tsx',
              '  const viewerUrl = useMemo(() => createViewerUrl(roomId), [roomId])\n',
              "  const viewerUrl = useMemo(() => streamId ? createViewerUrl(streamId) : '', [streamId])\n",
          )

          replace('apps/web/src/App.tsx', '  liveRoomId?: string\n', '  liveStreamId?: string\n')
          replace(
              'apps/web/src/App.tsx',
              '    liveRoomId: live ? stream.live_room_id ?? undefined : undefined,\n',
              '    liveStreamId: live ? stream.id : undefined,\n',
          )
          replace('apps/web/src/App.tsx', '    if (!session.liveRoomId) {\n', '    if (!session.liveStreamId) {\n')
          replace(
              'apps/web/src/App.tsx',
              "    url.searchParams.set('live', session.liveRoomId)\n",
              "    url.searchParams.set('live', session.liveStreamId)\n",
          )

          Path('apps/web/src/VerifiedLiveViewer.tsx').write_text('''import { useEffect, useState } from 'react'\nimport { authClient } from './auth'\nimport { BrandMark } from './BrandMark'\nimport { LiveViewer } from './LiveViewer'\nimport { schedulingClient, usesRemoteSchedulingApi } from './scheduling'\n\ntype ViewerStatus = 'checking' | 'active' | 'inactive' | 'unauthenticated' | 'denied' | 'error'\n\nexport function VerifiedLiveViewer({ streamId }: { streamId: string }) {\n  const [roomId, setRoomId] = useState<string | null>(null)\n  const [status, setStatus] = useState<ViewerStatus>(usesRemoteSchedulingApi ? 'checking' : 'inactive')\n\n  useEffect(() => {\n    if (!usesRemoteSchedulingApi) return\n    let mounted = true\n\n    const verify = async () => {\n      const session = await authClient.restore()\n      if (!mounted) return\n      if (!session) {\n        setRoomId(null)\n        setStatus('unauthenticated')\n        return\n      }\n\n      try {\n        const access = await schedulingClient.access(streamId, session.accessToken)\n        if (!mounted) return\n        if (!access.granted) {\n          setRoomId(null)\n          setStatus('denied')\n          return\n        }\n        if (!access.live_room_id) {\n          setRoomId(null)\n          setStatus('inactive')\n          return\n        }\n        setRoomId(access.live_room_id)\n        setStatus('active')\n      } catch {\n        if (!mounted) return\n        setRoomId(null)\n        setStatus('denied')\n      }\n    }\n\n    void verify()\n    return () => { mounted = false }\n  }, [streamId])\n\n  if (status === 'active' && roomId) return <LiveViewer roomId={roomId} />\n\n  const title = status === 'checking'\n    ? 'Verificando seu acesso'\n    : status === 'unauthenticated'\n      ? 'Entre para assistir'\n      : status === 'inactive'\n        ? 'Esta aula não está ao vivo'\n        : status === 'denied'\n          ? 'Acesso não autorizado'\n          : 'Não foi possível verificar a aula'\n\n  const description = status === 'checking'\n    ? 'Confirmando sua sessão e a permissão para esta transmissão.'\n    : status === 'unauthenticated'\n      ? 'O identificador da sala só é liberado após autenticação e verificação de acesso.'\n      : status === 'inactive'\n        ? 'Sua permissão foi verificada, mas não existe uma sala ativa para esta aula.'\n        : status === 'denied'\n          ? 'Esta transmissão exige a permissão, compra, assinatura ou convite aplicável à aula.'\n          : 'A fonte oficial de acesso está indisponível. Nenhuma sala será presumida como autorizada.'\n\n  return (\n    <div className="broadcast-viewer">\n      <header className="broadcast-viewer-header"><BrandMark /></header>\n      <main className="broadcast-viewer-main">\n        <section className="broadcast-stage" aria-live="polite">\n          <div className="broadcast-waiting">\n            <BrandMark symbolOnly />\n            <h1>{title}</h1>\n            <p>{description}</p>\n          </div>\n        </section>\n      </main>\n    </div>\n  )\n}\n''', encoding='utf-8')

          replace('apps/web/src/main.tsx', 'const liveRoomId = new URLSearchParams(window.location.search).get(\'live\')\n', 'const liveStreamId = new URLSearchParams(window.location.search).get(\'live\')\n')
          replace(
              'apps/web/src/main.tsx',
              '    {liveRoomId ? <VerifiedLiveViewer roomId={liveRoomId} /> : <App />}\n',
              '    {liveStreamId ? <VerifiedLiveViewer streamId={liveStreamId} /> : <App />}\n',
          )

          # Regression coverage: no scheduling response leaks a room id, including
          # PAID/SUBSCRIBERS/PRIVATE active streams.
          replace(
              'apps/api/tests/test_scheduling.py',
              '    assert created["live_room_id"] is None\n',
              '    assert "live_room_id" not in created\n',
          )
          replace(
              'apps/api/tests/test_scheduling.py',
              '    assert activated.json()["live_room_id"] == "room_live_123"\n',
              '    assert "live_room_id" not in activated.json()\n',
          )
          replace(
              'apps/api/tests/test_scheduling.py',
              '    assert [item["id"] for item in client.get("/streams/active").json()] == [stream_id]\n',
              '    active = client.get("/streams/active").json()\n    assert [item["id"] for item in active] == [stream_id]\n    assert "live_room_id" not in active[0]\n',
          )
          marker = '\n\ndef test_only_owner_creator_can_activate_or_finish_and_room_id_is_validated() -> None:\n'
          restricted_test = '''\n\ndef test_restricted_active_streams_never_expose_room_id_publicly() -> None:\n    cases = [\n        ("PAID", "29.90", "room_paid_123"),\n        ("SUBSCRIBERS", "0", "room_subscribers_123"),\n        ("PRIVATE", "0", "room_private_123"),\n    ]\n    for access_type, price, room_id in cases:\n        created = create_stream(access_type=access_type, price=price)\n        activated = client.post(f"/streams/{created['id']}/activate", json={"room_id": room_id})\n        assert activated.status_code == 200\n        assert "live_room_id" not in activated.json()\n\n    response = client.get("/streams/active")\n    assert response.status_code == 200\n    active = response.json()\n    assert {item["access_type"] for item in active} >= {"PAID", "SUBSCRIBERS", "PRIVATE"}\n    assert all("live_room_id" not in item for item in active)\n\n\ndef test_only_owner_creator_can_activate_or_finish_and_room_id_is_validated() -> None:\n'''
          replace('apps/api/tests/test_scheduling.py', marker, restricted_test)

          replace(
              'apps/api/tests/test_commerce.py',
              '''        return AccessDecision(\n            selected, user_id, granted, "ENTITLED" if granted else "ENTITLEMENT_REQUIRED",\n            uuid4() if (user_id, selected) in self.entitled else None, datetime.now(UTC),\n        )\n''',
              '''        return AccessDecision(\n            stream_id=selected,\n            user_id=user_id,\n            granted=granted,\n            reason="ENTITLED" if granted else "ENTITLEMENT_REQUIRED",\n            entitlement_id=uuid4() if (user_id, selected) in self.entitled else None,\n            checked_at=datetime.now(UTC),\n            live_room_id="room_live_secure" if granted else None,\n        )\n''',
          )
          replace(
              'apps/api/tests/test_commerce.py',
              '    assert access.json()["entitlement_id"] is not None\n',
              '    assert access.json()["entitlement_id"] is not None\n    assert access.json()["live_room_id"] == "room_live_secure"\n',
          )
          replace(
              'apps/api/tests/test_commerce.py',
              '    assert client.post(f"/streams/{stream_id}/access").status_code == 200\n\n\ndef test_commerce_authorization_and_payment_validation() -> None:\n',
              '''    access = client.post(f"/streams/{stream_id}/access")\n    assert access.status_code == 200\n    assert access.json()["live_room_id"] == "room_live_secure"\n\n\ndef test_stream_access_requires_authentication_before_room_is_exposed() -> None:\n    global current_user\n    repository.access_type = "FREE"\n    app.dependency_overrides.pop(get_current_user, None)\n    try:\n        response = client.post(f"/streams/{stream_id}/access")\n        assert response.status_code == 401\n        assert "live_room_id" not in response.json()\n    finally:\n        app.dependency_overrides[get_current_user] = lambda: current_user\n\n\ndef test_commerce_authorization_and_payment_validation() -> None:\n''',
          )

          # Remove this one-shot workflow from the resulting tree.
          Path('.github/workflows/apply-stream-access-security-fix.yml').unlink()
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Test backend
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          pytest
          python -m compileall -q app tests

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Test frontend
        working-directory: apps/web
        run: |
          npm ci
          npm run typecheck
          npm run test -- --run
          npm run build

      - name: Commit verified fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: gate live room behind authenticated access'
          git push origin HEAD:fix/issue-8-active-live-system-v2
