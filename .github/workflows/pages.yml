name: Homologação Web

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build e publicar homologação
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        working-directory: apps/web
        run: npm install --no-audit --no-fund

      - name: Validar frontend
        working-directory: apps/web
        env:
          VITE_LIVE_SOCKET_URL: https://telaviva-api-homolog.onrender.com
          VITE_HOMOLOG_SOCKET_PATH: /homolog/live
        run: |
          npm run typecheck
          npm run test -- --run
          npm run build

      - name: Configurar e habilitar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Empacotar build
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
