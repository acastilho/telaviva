name: Client Preview

on:
  push:
    branches: [main]
    paths:
      - 'preview/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: client-preview
  cancel-in-progress: true

jobs:
  preview:
    name: Package client preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate preview
        run: test -s preview/index.html

      - name: Upload downloadable preview
        uses: actions/upload-artifact@v4
        with:
          name: client-preview
          path: preview/
          retention-days: 30

      - name: Configure Pages when enabled
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: preview

      - name: Deploy to GitHub Pages
        if: steps.pages.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4
