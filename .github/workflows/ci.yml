name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Validate web experience
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate product identity and public privacy
        shell: bash
        run: |
          test -s README.md
          test -s preview/index.html
          test -s apps/web/src/BrandMark.tsx
          test -s apps/web/src/auth.ts
          test -s apps/web/src/LiveRoom.tsx
          grep -Eqi "Instituto[[:space:]]+Tela[[:space:]]+Viva" README.md
          grep -Eqi "Instituto[[:space:]]+Tela[[:space:]]+Viva" preview/index.html
          grep -qi "Instituto Tela Viva" apps/web/index.html
          grep -qi "Onde o conhecimento" apps/web/src/App.tsx
          if grep -Eqi "Vercel|Render|Neon|PostgreSQL|FastAPI" preview/index.html; then
            echo "Public preview must not expose infrastructure providers or implementation details."
            exit 1
          fi

      - name: Validate preview HTML structure
        run: |
          grep -qi '<!doctype html>' preview/index.html
          grep -qi '<meta name="viewport"' preview/index.html
          grep -qi '</html>' preview/index.html

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package.json

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm install --no-audit --no-fund

      - name: Typecheck frontend
        working-directory: apps/web
        run: npm run typecheck

      - name: Test frontend
        working-directory: apps/web
        run: npm run test -- --run

      - name: Build frontend
        working-directory: apps/web
        run: npm run build

  api:
    name: Validate API and security flows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install API dependencies
        working-directory: apps/api
        run: pip install -e '.[dev]'

      - name: Run API tests
        working-directory: apps/api
        env:
          APP_ENV: test
          JWT_SECRET: ci-only-secret-that-is-long-enough-for-tests-123456
        run: pytest -q
