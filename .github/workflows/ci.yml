name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Instituto Tela Viva repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required project files and brand
        run: |
          test -s README.md
          test -s preview/index.html
          test -s apps/web/src/BrandMark.tsx
          grep -Eqi "Instituto[[:space:]]+Tela[[:space:]]+Viva" README.md
          grep -Eqi "Instituto[[:space:]]+Tela[[:space:]]+Viva" preview/index.html
          grep -qi "Instituto Tela Viva" apps/web/index.html
          grep -qi "conectar à natureza" apps/web/src/App.tsx

      - name: Validate preview HTML structure
        run: |
          grep -qi '<!doctype html>' preview/index.html
          grep -qi '<meta name="viewport"' preview/index.html
          grep -qi '</html>' preview/index.html

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm install --no-audit --no-fund

      - name: Typecheck frontend
        working-directory: apps/web
        run: npm run typecheck

      - name: Test frontend
        working-directory: apps/web
        run: npm run test -- --run

      - name: Build frontend
        working-directory: apps/web
        run: npm run build
