name: Apply authenticated live access gate

on:
  push:
    branches:
      - fix/issue-8-active-live-system-v2
    paths:
      - .github/workflows/apply-live-access-gate.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-8-active-live-system-v2
          fetch-depth: 0

      - name: Patch remaining source and regression test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected snippet missing in {path}: {old[:120]!r}')
              file.write_text(text.replace(old, new, count), encoding='utf-8')

          replace(
              'apps/web/src/LiveStudio.tsx',
              '  const viewerUrl = useMemo(() => createViewerUrl(roomId), [roomId])\n',
              "  const viewerUrl = useMemo(() => streamId ? createViewerUrl(streamId) : '', [streamId])\n",
          )

          replace('apps/web/src/App.tsx', '  liveRoomId?: string\n', '  liveStreamId?: string\n')
          replace(
              'apps/web/src/App.tsx',
              '    liveRoomId: live ? stream.live_room_id ?? undefined : undefined,\n',
              '    liveStreamId: live ? stream.id : undefined,\n',
          )
          replace('apps/web/src/App.tsx', '    if (!session.liveRoomId) {\n', '    if (!session.liveStreamId) {\n')
          replace(
              'apps/web/src/App.tsx',
              "    url.searchParams.set('live', session.liveRoomId)\n",
              "    url.searchParams.set('live', session.liveStreamId)\n",
          )

          replace(
              'apps/api/tests/test_scheduling.py',
              '    assert created["live_room_id"] is None\n',
              '    assert "live_room_id" not in created\n',
          )
          replace(
              'apps/api/tests/test_scheduling.py',
              '    assert activated.json()["live_room_id"] == "room_live_123"\n',
              '    assert "live_room_id" not in activated.json()\n',
          )
          replace(
              'apps/api/tests/test_scheduling.py',
              '    assert [item["id"] for item in client.get("/streams/active").json()] == [stream_id]\n',
              '    active = client.get("/streams/active").json()\n    assert [item["id"] for item in active] == [stream_id]\n    assert "live_room_id" not in active[0]\n',
          )
          marker = '\n\ndef test_only_owner_creator_can_activate_or_finish_and_room_id_is_validated() -> None:\n'
          restricted = '''\n\ndef test_restricted_active_streams_never_expose_room_id_publicly() -> None:\n    cases = [\n        ("PAID", "29.90", "room_paid_123"),\n        ("SUBSCRIBERS", "0", "room_subscribers_123"),\n        ("PRIVATE", "0", "room_private_123"),\n    ]\n    for access_type, price, room_id in cases:\n        created = create_stream(access_type=access_type, price=price)\n        activated = client.post(f"/streams/{created['id']}/activate", json={"room_id": room_id})\n        assert activated.status_code == 200\n        assert "live_room_id" not in activated.json()\n\n    response = client.get("/streams/active")\n    assert response.status_code == 200\n    active = response.json()\n    assert {item["access_type"] for item in active} >= {"PAID", "SUBSCRIBERS", "PRIVATE"}\n    assert all("live_room_id" not in item for item in active)\n\n\ndef test_only_owner_creator_can_activate_or_finish_and_room_id_is_validated() -> None:\n'''
          replace('apps/api/tests/test_scheduling.py', marker, restricted)

          Path('.github/workflows/apply-live-access-gate.yml').unlink()
          PY

      - name: Validate patch shape
        run: |
          grep -q 'liveStreamId' apps/web/src/App.tsx
          grep -q 'createViewerUrl(streamId)' apps/web/src/LiveStudio.tsx
          ! grep -q 'live_room_id' apps/api/app/scheduling/schemas.py
          grep -q 'restricted_active_streams_never_expose_room_id_publicly' apps/api/tests/test_scheduling.py

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: enforce authenticated live room access'
          git push origin HEAD:fix/issue-8-active-live-system-v2
