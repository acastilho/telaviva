name: Android Recorder APK

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/recorder-android/**"
      - ".github/workflows/android-recorder-apk.yml"
  pull_request:
    paths:
      - "apps/recorder-android/**"
      - ".github/workflows/android-recorder-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    defaults:
      run:
        working-directory: apps/recorder-android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ant autoconf automake autopoint ccache cmake \
            g++ gcc git lbzip2 libffi-dev libltdl-dev libtool \
            libssl-dev make patch pkg-config python3-dev \
            unzip wget zip

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer cython

      - name: Cache Buildozer downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            apps/recorder-android/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('apps/recorder-android/buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Build debug APK
        run: buildozer -v android debug

      - name: List generated files
        if: always()
        run: find bin -maxdepth 1 -type f -print || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: telaviva-recorder-apk
          path: apps/recorder-android/bin/*.apk
          if-no-files-found: error
