services:
  - type: web
    name: telaviva-homolog
    runtime: static
    rootDir: preview
    buildCommand: echo "TelaViva static homologation preview"
    staticPublishPath: .
    autoDeployTrigger: off

  - type: web
    name: telaviva-api-homolog
    runtime: python
    rootDir: apps/api
    buildCommand: pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/live
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: homologation
      - key: API_CORS_ORIGINS
        value: '["https://acastilho.github.io"]'
